services:
  postgres:
   image: postgres:16
   container_name: postgres_idp_db
   restart: always
   environment:
    POSTGRES_USER: idp_user
    POSTGRES_PASSWORD: password
    POSTGRES_DB: idp_db
   ports:
      - "5432:5432"
   volumes: 
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
